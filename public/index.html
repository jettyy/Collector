<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>트렌드 키워드 대시보드</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js" defer></script>
  <script src="dashboard.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>트렌드 키워드</h1>
      <span id="lastRun" class="muted">불러오는 중…</span>
    </div>
    <div class="topbar-right">
      <span id="flags" class="flags"></span>
      <button id="runNow" type="button" class="btn">지금 수집</button>
    </div>
  </header>

  <main>
    <section class="filters" aria-label="필터">
      <label class="field">
        <span>기간</span>
        <select id="hours">
          <option value="6">최근 6시간</option>
          <option value="24" selected>최근 24시간</option>
          <option value="72">최근 3일</option>
          <option value="168">최근 7일</option>
        </select>
      </label>
      <div class="segmented" role="radiogroup" aria-label="분류">
        <button type="button" data-label="정보성" class="on">정보성</button>
        <button type="button" data-label="제외">제외</button>
        <button type="button" data-label="">전체</button>
      </div>
      <div id="sourceToggles" class="chips" aria-label="출처"></div>
      <label class="check"><input type="checkbox" id="notifiedOnly" /> 알림 보낸 것만</label>
      <input id="search" type="search" placeholder="키워드 검색" />
    </section>

    <section class="tiles">
      <div class="tile"><span class="tile-label">정보성 신규</span><span id="tInfo" class="tile-value">–</span></div>
      <div class="tile"><span class="tile-label">알림 발송</span><span id="tNotified" class="tile-value">–</span></div>
      <div class="tile"><span class="tile-label">블로그 발행</span><span id="tPublished" class="tile-value">–</span></div>
      <div class="tile"><span class="tile-label">최근 실행 오류</span><span id="tErrors" class="tile-value">–</span></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>시간대별 신규 감지량</h2>
        <button type="button" id="toggleTable" class="link">표로 보기</button>
      </div>
      <div class="chart-wrap"><canvas id="hourlyChart" aria-label="시간대별 신규 감지 키워드 수" role="img"></canvas></div>
      <table id="hourlyTable" class="data hidden"><thead><tr><th>시간</th><th>정보성</th><th>제외</th><th>알림</th></tr></thead><tbody></tbody></table>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>키워드 <span id="kwCount" class="muted"></span></h2>
      </div>
      <ul id="keywordList" class="kw-list"></ul>
      <p id="empty" class="muted hidden">조건에 맞는 키워드가 없습니다.</p>
    </section>

    <details class="card">
      <summary><h2>최근 실행 기록</h2></summary>
      <table class="data"><thead><tr><th>#</th><th>시작</th><th>소요</th><th>수집</th><th>후보</th><th>정보성</th><th>신규</th><th>알림</th><th>오류</th></tr></thead><tbody id="runs"></tbody></table>
    </details>
  </main>
</body>
</html>
